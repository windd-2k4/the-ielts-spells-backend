services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ielts_center
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: en,vi
      LT_DISABLE_WEB_UI: "true"
    restart: unless-stopped

volumes:
  postgres-data:
