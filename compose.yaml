services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ielts_center
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts_center"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
