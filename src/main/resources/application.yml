spring:
  http:
    client:
      factory: simple
  servlet:
    multipart:
      max-file-size: ${FILE_STORAGE_MAX_FILE_SIZE:50MB}
      max-request-size: ${FILE_STORAGE_MAX_REQUEST_SIZE:55MB}
  config:
    import: optional:file:.env[.properties]
  application:
    name: the-ielts-spells-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ielts_center}
    username: ${DATABASE_USERNAME:ielts}
    password: ${DATABASE_PASSWORD:ielts}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:https://example.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://example.supabase.co/auth/v1/.well-known/jwks.json}
          audiences: ${SUPABASE_JWT_AUDIENCE:authenticated}
          jws-algorithms: ES256

server:
  port: ${PORT:8080}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui
    persist-authorization: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  access-approval:
    admin-email: ${ADMIN_APPROVAL_EMAIL:}
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
    management-url: ${MANAGEMENT_APP_URL:http://localhost:5174}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    provider: ${FILE_STORAGE_PROVIDER:LOCAL}
    max-upload-bytes: ${FILE_STORAGE_MAX_UPLOAD_BYTES:52428800}
    local-directory: ${FILE_STORAGE_LOCAL_DIRECTORY:./data/uploads}
    supabase-bucket: ${SUPABASE_STORAGE_BUCKET:learning-library}
  ai:
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:10}
    import-timeout-seconds: ${AI_IMPORT_TIMEOUT_SECONDS:120}
    chat-timeout-seconds: ${AI_CHAT_TIMEOUT_SECONDS:30}
    quiz-timeout-seconds: ${AI_QUIZ_TIMEOUT_SECONDS:60}
    import-providers: ${AI_IMPORT_PROVIDERS:GEMINI,NVIDIA}
    chat-providers: ${AI_CHAT_PROVIDERS:NVIDIA,GEMINI}
    quiz-providers: ${AI_QUIZ_PROVIDERS:NVIDIA,GEMINI}
    retry:
      max-retries-per-model: ${AI_MAX_RETRIES_PER_MODEL:1}
      initial-backoff-millis: ${AI_INITIAL_BACKOFF_MILLIS:250}
      max-backoff-millis: ${AI_MAX_BACKOFF_MILLIS:2000}
    circuit-breaker:
      failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:3}
      cooldown-seconds: ${AI_CIRCUIT_COOLDOWN_SECONDS:30}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      import-models: ${GEMINI_IMPORT_MODELS:${GEMINI_MODEL:gemini-3.5-flash-lite,gemini-2.5-flash,gemini-3.5-flash,gemini-3.1-flash-lite}}
      chat-models: ${GEMINI_CHAT_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash}
      quiz-models: ${GEMINI_QUIZ_MODELS:gemini-3.5-flash,gemini-2.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
    nvidia:
      api-key: ${NVIDIA_API_KEY:}
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      import-models: ${NVIDIA_IMPORT_MODELS:${NVIDIA_MODEL:nvidia/nemotron-3-super-120b-a12b,nvidia/nemotron-3.5-lightning-30b-a3b,mistralai/mistral-nemotron}}
      chat-models: ${NVIDIA_CHAT_MODELS:nvidia/nemotron-3-super-120b-a12b,nvidia/nemotron-3.5-lightning-30b-a3b,mistralai/mistral-nemotron}
      quiz-models: ${NVIDIA_QUIZ_MODELS:nvidia/nemotron-3-super-120b-a12b,nvidia/nemotron-3.5-lightning-30b-a3b,mistralai/mistral-nemotron}

logging:
  level:
    org.springframework.security.oauth2: DEBUG
