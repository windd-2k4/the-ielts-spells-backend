spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: the-ielts-spells-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ielts_center}
    username: ${DATABASE_USERNAME:ielts}
    password: ${DATABASE_PASSWORD:ielts}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:https://example.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://example.supabase.co/auth/v1/.well-known/jwks.json}
          audiences: ${SUPABASE_JWT_AUDIENCE:authenticated}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui
    persist-authorization: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
