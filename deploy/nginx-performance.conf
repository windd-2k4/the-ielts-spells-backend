log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';

access_log /var/log/nginx/access_timing.log timed;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript text/css text/plain text/xml application/xml application/xml+rss;
